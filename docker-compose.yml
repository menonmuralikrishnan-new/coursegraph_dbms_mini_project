services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coursegraph
      POSTGRES_PASSWORD: coursegraph
      POSTGRES_DB: coursegraph
    ports: ["5432:5432"]
    volumes: ["coursegraph_pg:/var/lib/postgresql/data"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["coursegraph_mongo:/data/db"]
volumes:
  coursegraph_pg:
  coursegraph_mongo:
